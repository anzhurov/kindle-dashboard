<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>Kindle dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=block&subset=cyrillic" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="left">
    <header>
      <div class="weekday" id="weekday">—</div>
      <div class="date" id="date">—</div>
    </header>

    <section class="now">
      <div class="temp" id="temp">--°</div>
      <div class="cond" id="cond">—</div>
      <div class="now-info muted">
        <div id="feels"></div>
        <div id="minmax"></div>
        <div id="extra"></div>
        <div id="sun"></div>
      </div>
    </section>
  </main>

  <aside class="right">
    <section class="hours" id="hours"></section>
    <section class="days" id="days"></section>
    <footer>
      <span>оновлено <span id="updated">--:--</span></span>
    </footer>
  </aside>

  <script src="config.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
