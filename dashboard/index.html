<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>Kindle dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=block&subset=cyrillic" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="weekday" id="weekday">—</div>
    <div class="date" id="date">—</div>
  </header>

  <section class="now">
    <div class="temp" id="temp">--°</div>
    <div class="now-info">
      <div class="cond" id="cond">—</div>
      <div class="muted" id="feels"></div>
      <div class="muted" id="minmax"></div>
      <div class="muted" id="extra"></div>
      <div class="muted" id="sun"></div>
    </div>
  </section>

  <section class="hours" id="hours"></section>

  <section class="days" id="days"></section>

  <section class="notes">
    <h2>Нотатки</h2>
    <ul>
      <li>Відредагуйте цей блок у dashboard/index.html</li>
      <li>Push у main — і через кілька хвилин він тут</li>
    </ul>
  </section>

  <footer>
    <span id="city"></span>
    <span>оновлено <span id="updated">--:--</span></span>
  </footer>

  <script src="config.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
