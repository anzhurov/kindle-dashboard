<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>Kindle dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=block&subset=cyrillic" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="now">
    <header>
      <div class="weekday" id="weekday">—</div>
      <div class="date secondary" id="date">—</div>
    </header>

    <section class="hero">
      <div class="hero-row">
        <div class="hero-icon" id="now-icon"></div>
        <div class="temp" id="temp">--°</div>
      </div>
      <div class="cond" id="cond">—</div>
      <div class="secondary" id="feels"></div>
    </section>

    <section class="facts" id="facts"></section>
  </main>

  <aside class="cards">
    <section class="card">
      <h2>Погодинно</h2>
      <div class="hours" id="hours"></div>
    </section>
    <section class="card grow">
      <h2>Найближчі дні</h2>
      <div class="days" id="days"></div>
    </section>
  </aside>

  <!-- keep the top-right corner and the right half of the footer empty: the Kindle draws battery and OFFLINE there -->
  <footer class="tertiary"><span>Оновлено</span><span id="updated">—</span></footer>

  <script src="config.js"></script>
  <script src="icons.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
